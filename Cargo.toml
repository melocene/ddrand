[package]
name = "ddrand"
version = "0.4.1"
edition = "2024"
rust-version = "1.95" # Enforce minimum Rust compiler version.
publish = false
authors = ["melocene", "ddrand contributors"]
homepage = "https://github.com/melocene/ddrand"
readme = "README.md"
license-file = "LICENSE"

[[bin]]
name = "ddrand"
doc = false
doctest = false
bench = false

[profile.release]
lto = true
panic = "abort"
strip = true
codegen-units = 1

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
  "alloc",
] }
clap = { version = "4.6.6", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
dunce = "1.0.5"
flexi_logger = { version = "0.31.10", features = [
  "async",
  "buffer_writer",
], default-features = false }
indexmap = "2.14.0"
log = "0.4.33"
open = { version = "5.4.1", features = ["shellexecute-on-windows"] }
rand = "0.10.2"
rand_pcg = "0.10.2"
rand_seeder = "0.5.0"
regex = { version = "1.13.1", default-features = false, features = [
  "std",
  "perf",
  "unicode-perl",
] }
remove_dir_all = { version = "1.0.0", features = ["parallel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.17.1", default-features = false, features = [
  "accessibility",
  "backend-winit",
  "compat-1-2",
  "renderer-winit-software",
  "std",
] }
steamlocate = "2.1.0"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = [
  "common-controls-v6",
] }

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = [
  "xdg-portal",
  "wayland",
] }

[build-dependencies]
slint-build = "1.17.1"
